# LXDOC 企业知识库一键编排
# 启动：docker compose up -d
# 前端：http://localhost:8080  后端 API：http://localhost:3000/api
#
# 敏感配置（数据库密码、JWT secret、OnlyOffice secret）通过项目根目录 .env 注入，
# .env 不入库（已在 .gitignore）。首次部署请复制 .env.example 为 .env 并修改默认值。
#
# 安全说明：
# - postgres 不对外暴露端口，仅 compose 内网通信
# - backend / onlyoffice 默认不对外暴露端口，统一经 frontend(nginx) 反代
#   （如需直连调试，取消注释 ports）
services:
  # PostgreSQL 数据库
  postgres:
    image: pgvector/pgvector:pg16  # 含 vector 0.8.2 + pg_trgm，知识库 RAG 向量检索
    container_name: lxdoc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lxdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 中设置数据库密码}
      POSTGRES_DB: ${POSTGRES_DB:-lxdoc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 生产环境不对外暴露 5432，仅 compose 内网访问
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lxdoc} -d ${POSTGRES_DB:-lxdoc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 资源限制，防止单容器耗尽主机资源
    mem_limit: 1g
    cpus: 2
    # docker 18.09 容器创建时不支持多网络连接，所有服务统一接入 default 网络；
    # postgres 不对外暴露端口（上方 ports 注释），仅 compose 内网可达，隔离由不映射端口保证
    networks:
      - default

  # 后端 NestJS 服务
  backend:
    # 镜像优先：CI 发布后 docker pull 即可；本地开发用 docker compose build 覆盖
    image: ${LXDOC_IMAGE_PREFIX:-ghcr.io/yangzhenyu-123}/lxdoc-backend:${LXDOC_IMAGE_TAG:-latest}
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.backend
    container_name: lxdoc-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-lxdoc}
      DB_PASS: ${POSTGRES_PASSWORD:?必须在 .env 中设置数据库密码}
      DB_NAME: ${POSTGRES_DB:-lxdoc}
      UPLOAD_DIR: /app/uploads
      # Auth（生产环境强制要求 JWT_SECRET，后端启动时会校验非默认值）
      JWT_SECRET: ${JWT_SECRET:?必须在 .env 中设置 JWT_SECRET（强随机值）}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      FILE_TOKEN_EXPIRES: ${FILE_TOKEN_EXPIRES:-10m}
      # OnlyOffice 集成
      ONLYOFFICE_ENABLED: ${ONLYOFFICE_ENABLED:-true}
      ONLYOFFICE_URL: http://onlyoffice
      ONLYOFFICE_PUBLIC_URL: /onlyoffice
      BACKEND_PUBLIC_URL: http://backend:3000
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?必须在 .env 中设置 OnlyOffice JWT secret}
      # kkFileView 统一预览（容器内访问服务名，浏览器经 nginx 反代 /kkview）
      KKFILEVIEW_ENABLED: ${KKFILEVIEW_ENABLED:-true}
      KKFILEVIEW_URL: http://kkfileview:8012
      KKFILEVIEW_PUBLIC_URL: /kkview
      # PDF 版式预览：调用 pdf2html sidecar（HTTP）；为空时降级为本地 PDF2HTML_BIN 二进制
      PDF2HTML_URL: ${PDF2HTML_URL:-http://pdf2html:7000}
      # PDF 转可编辑：soffice/pandoc 仍在后端镜像内本地执行
      SOFFICE_BIN: soffice
      # LLM（默认关闭，待内网 GLM5.2 接入时开启）
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://internal-glm/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-glm-5.2}
      # Embedding 服务（TEI bge-m3 等）：LLM_ENABLED=true 且 RAG 要用，必须配置
      # 未配置时 KnowledgeBaseService.create 抛错（无法生成 chunk 向量）
      LLM_EMBED_BASE_URL: ${LLM_EMBED_BASE_URL:-}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-}
      LLM_EMBED_DIMENSIONS: ${LLM_EMBED_DIMENSIONS:-0}
      # Rerank 服务（TEI bge-reranker-v2-m3 等，可选）：未配置时 RetrievalService.isRerankReady()=false，
      # RAG 自动跳过 rerank 步骤回退纯 RRF，不影响现有功能
      LLM_RERANK_BASE_URL: ${LLM_RERANK_BASE_URL:-}
      LLM_RERANK_MODEL: ${LLM_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      LLM_RERANK_CANDIDATE_K: ${LLM_RERANK_CANDIDATE_K:-20}
      # LLM 调用超时/重试/摘要长度（可选，有默认值）
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_SUMMARY_MAX_CHARS: ${LLM_SUMMARY_MAX_CHARS:-80000}
      # API 调试文档（Swagger UI）：生产默认关闭，需调试时在 .env 设 ENABLE_API_DOCS=true
      # 开启后访问 http://localhost:8080/api/docs
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      # docling-serve 统一文档解析（主解析器，支持 PDF 图片/表格/OCR）
      # 启用时上传 docx/odt/pdf 优先走 docling，失败回退 pandoc/pdf-parse
      DOCLING_ENABLED: ${DOCLING_ENABLED:-false}
      DOCLING_URL: ${DOCLING_URL:-http://docling:5001}
      DOCLING_API_KEY: ${DOCLING_API_KEY:-}
      DOCLING_DO_OCR: ${DOCLING_DO_OCR:-false}
      DOCLING_TIMEOUT: ${DOCLING_TIMEOUT:-180000}
    depends_on:
      postgres:
        condition: service_healthy
      # pdf2html 为软依赖：sidecar 未就绪时仅 PDF 版式预览不可用，不阻断后端启动
      # 故不强制 service_healthy，避免 sidecar 故障导致整个后端起不来
      pdf2html:
        condition: service_started
      # docling 为软依赖：未就绪时上传回退本地 pandoc/pdf-parse，不阻断后端启动
      docling:
        condition: service_started
    volumes:
      # 上传文件目录挂载到宿主机，便于持久化与查看
      - ./uploads:/app/uploads
    # 生产环境经 nginx 反代，不直接暴露
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    healthcheck:
      # 使用 node 内置 http 模块探活，避免依赖 curl/wget
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # LibreOffice/pdf 转换是内存大户，限制资源避免 OOM 影响其他服务
    mem_limit: 2g
    cpus: 2
    # docker 18.09 容器创建时不支持多网络连接，统一接入 default 网络；
    # postgres/onlyoffice/pdf2html/docling 均在 default，backend 可直接访问
    networks:
      - default

  # OnlyOffice Document Server（docx/odt 原格式编辑）
  # AGPL 许可，仅自用/内部部署合规；商业发行需购买商业版
  # 9.4 起移除 RabbitMQ/Postgres 依赖，单进程架构，社区版无 20 连接限制
  onlyoffice:
    image: onlyoffice/documentserver:9.4
    container_name: lxdoc-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?必须在 .env 中设置 OnlyOffice JWT secret}
      # 关闭未授权存储访问：文件接口走鉴权签名 URL，不应允许 http 未授权存储
      USE_UNAUTHORIZED_STORAGE: "false"
    volumes:
      # 持久化文档转换缓存与字体
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-cache:/var/lib/onlyoffice
    # OnlyOffice 仅内网暴露，经前端 nginx /onlyoffice 反代访问
    expose:
      - "80"
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2

  # kkFileView 统一预览服务（100+ 格式开箱即用，仅 compose 内网，经 nginx 反代 /kkview）
  # 内置 LibreOffice，作为 docx/odt/pdf 等保真预览的统一入口，替代 pandoc/pdf2htmlEX 预览降级链路
  kkfileview:
    # kkFileView 5.1.0（wangbowen 镜像，内置 LibreOffice + JDK21，5.0 起默认 context-path 为 /）
    # 4.x 镜像内置 LibreOffice 持续 exit 81 崩溃；5.1.0 修复且 LibreOffice Connected 成功
    image: keking/kkfileview:5.1.0
    container_name: lxdoc-kkfileview
    environment:
      # context-path 设为 /kkview，使预览完整路径为 /kkview/onlinePreview，
      # nginx 透传完整 URI（proxy_pass 不带尾斜杠），kkfileview 内部重定向天然含 /kkview 前缀
      KK_CONTEXT_PATH: /kkview
      # 5.1.0 新增 TrustHostFilter：kkfileview 拉取文件时校验文件 URL 的 host 是否在信任列表，
      # 后端 fileUrl 为 http://backend:3000/...，需将 backend 加入信任主机，否则返回 403
      # 设为 * 允许所有主机（内网部署，安全风险可控）
      KK_TRUST_HOST: "*"
    expose:
      - "8012"
    healthcheck:
      # kkFileView 5.x 镜像内置 wget；context-path 为 /kkview，根路径返回演示页 200
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8012/kkview/"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Spring Boot + LibreOffice 初始化较慢，给 90s 启动窗口
      start_period: 90s
    # 软依赖：后端不强制等待，kkFileView 未就绪时预览接口返回 503，前端回退
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2

  # pdf2htmlEX sidecar：PDF → 版式保真 HTML（仅 compose 内网，不对外暴露）
  # 后端通过 PDF2HTML_URL 以 HTTP 调用，PDF 原文件字节 POST 到 /convert
  # sidecar 故障仅影响 PDF「版式预览」tab，「翻页预览」「编辑文本」「转可编辑」不受影响
  pdf2html:
    image: ${LXDOC_IMAGE_PREFIX:-ghcr.io/yangzhenyu-123}/lxdoc-pdf2html:${LXDOC_IMAGE_TAG:-latest}
    build:
      context: ./docker/pdf2html
      dockerfile: Dockerfile
    container_name: lxdoc-pdf2html
    expose:
      - "7000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7000/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1

  # docling-serve sidecar：统一文档解析（docx/odt/pdf → markdown + 图片/表格/OCR）
  # 作为主解析器：后端 DOCLING_ENABLED=true 时上传走此服务，失败自动回退 pandoc/pdf-parse
  # 仅 compose 内网，不对外暴露；CPU 镜像，OCR/大 PDF 解析吃内存，限制 4g/2cpu
  # 首次启动需下载约 2GB 模型，start_period 给 120s；模型缓存在 volume 避免重复下载
  docling:
    image: quay.io/docling-project/docling-serve:cpu-latest
    container_name: lxdoc-docling
    environment:
      # 内网部署可设 DOCLING_SERVE_API_KEY 增加鉴权，后端用 DOCLING_API_KEY 对应
      DOCLING_SERVE_ENABLE_UI: "false"
    volumes:
      - docling-models:/root/.cache/docling
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: "on-failure:5"
    mem_limit: 4g
    cpus: 2
    # docker 18.09 单网络兼容：统一接入 default，不对外暴露（expose 而非 ports）
    networks:
      - default

  # 前端 nginx 服务
  frontend:
    image: ${LXDOC_IMAGE_PREFIX:-ghcr.io/yangzhenyu-123}/lxdoc-frontend:${LXDOC_IMAGE_TAG:-latest}
    build:
      # 构建上下文为项目根，使 Dockerfile 能同时访问 web/（源码）与 docker/（nginx.conf），
      # 避免使用 additional_contexts（依赖 BuildKit，docker 18.09 经典 builder 不支持）
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: lxdoc-frontend
    depends_on:
      backend:
        condition: service_healthy
      # kkfileview 必须先启动，否则 nginx 启动时无法解析 upstream 主机名
      kkfileview:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      # nginx:alpine 自带 wget
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1

  # 备份服务：cron 定时 pg_dump 数据库 + tar 打包 uploads，归档到宿主机 ./backups
  # 恢复：docker-compose exec backup /usr/local/bin/restore.sh list
  backup:
    build:
      context: .
      dockerfile: docker/Dockerfile.backup
    container_name: lxdoc-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-lxdoc}
      DB_PASS: ${POSTGRES_PASSWORD:?必须在 .env 中设置数据库密码}
      DB_NAME: ${POSTGRES_DB:-lxdoc}
      UPLOADS_DIR: /app/uploads
      BACKUP_DIR: /backups
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      # 复用 backend 的 uploads 挂载（只读即可，备份不需写）
      - ./uploads:/app/uploads:ro
      # 备份归档到宿主机，便于外部存储同步
      - ./backups:/backups
    # 不对外暴露端口，仅 compose 内网访问 postgres
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    networks:
      - default

networks:
  # default 网络：所有服务统一接入。
  # docker 18.09 容器创建时不支持多网络连接，故合并为单网络；
  # 服务间隔离通过不对外暴露端口实现（postgres/onlyoffice/backend 默认不映射端口）。
  default:

volumes:
  postgres-data:
  onlyoffice-data:
  onlyoffice-cache:
  docling-models:
