# LXDOC 企业知识库一键编排
# 启动：docker compose up -d
# 前端：http://localhost:8080  后端 API：http://localhost:3000/api
#
# 敏感配置（数据库密码、JWT secret、OnlyOffice secret）通过项目根目录 .env 注入，
# .env 不入库（已在 .gitignore）。首次部署请复制 .env.example 为 .env 并修改默认值。
#
# 安全说明：
# - postgres 不对外暴露端口，仅 compose 内网通信
# - backend / onlyoffice 默认不对外暴露端口，统一经 frontend(nginx) 反代
#   （如需直连调试，取消注释 ports）
services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: lxdoc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lxdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 中设置数据库密码}
      POSTGRES_DB: ${POSTGRES_DB:-lxdoc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 生产环境不对外暴露 5432，仅 compose 内网访问
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lxdoc} -d ${POSTGRES_DB:-lxdoc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 资源限制，防止单容器耗尽主机资源
    mem_limit: 1g
    cpus: 2
    # 仅接入 internal 网络，frontend 无法直连 DB
    networks:
      - internal

  # 后端 NestJS 服务
  backend:
    # 镜像优先：CI 发布后 docker pull 即可；本地开发用 docker compose build 覆盖
    image: ${LXDOC_IMAGE_PREFIX:-ghcr.io/yangzhenyu-123}/lxdoc-backend:${LXDOC_IMAGE_TAG:-latest}
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.backend
    container_name: lxdoc-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-lxdoc}
      DB_PASS: ${POSTGRES_PASSWORD:?必须在 .env 中设置数据库密码}
      DB_NAME: ${POSTGRES_DB:-lxdoc}
      UPLOAD_DIR: /app/uploads
      # Auth（生产环境强制要求 JWT_SECRET，后端启动时会校验非默认值）
      JWT_SECRET: ${JWT_SECRET:?必须在 .env 中设置 JWT_SECRET（强随机值）}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      FILE_TOKEN_EXPIRES: ${FILE_TOKEN_EXPIRES:-10m}
      # OnlyOffice 集成
      ONLYOFFICE_ENABLED: ${ONLYOFFICE_ENABLED:-true}
      ONLYOFFICE_URL: http://onlyoffice
      ONLYOFFICE_PUBLIC_URL: /onlyoffice
      BACKEND_PUBLIC_URL: http://backend:3000
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?必须在 .env 中设置 OnlyOffice JWT secret}
      # PDF 版式预览：调用 pdf2html sidecar（HTTP）；为空时降级为本地 PDF2HTML_BIN 二进制
      PDF2HTML_URL: ${PDF2HTML_URL:-http://pdf2html:7000}
      # PDF 转可编辑：soffice/pandoc 仍在后端镜像内本地执行
      SOFFICE_BIN: soffice
      # LLM（默认关闭，待内网 GLM5.2 接入时开启）
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://internal-glm/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-glm-5.2}
      # API 调试文档（Swagger UI）：生产默认关闭，需调试时在 .env 设 ENABLE_API_DOCS=true
      # 开启后访问 http://localhost:8080/api/docs
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      # docling-serve 统一文档解析（主解析器，支持 PDF 图片/表格/OCR）
      # 启用时上传 docx/odt/pdf 优先走 docling，失败回退 pandoc/pdf-parse
      DOCLING_ENABLED: ${DOCLING_ENABLED:-false}
      DOCLING_URL: ${DOCLING_URL:-http://docling:5001}
      DOCLING_API_KEY: ${DOCLING_API_KEY:-}
      DOCLING_DO_OCR: ${DOCLING_DO_OCR:-false}
      DOCLING_TIMEOUT: ${DOCLING_TIMEOUT:-180000}
    depends_on:
      postgres:
        condition: service_healthy
      # pdf2html 为软依赖：sidecar 未就绪时仅 PDF 版式预览不可用，不阻断后端启动
      # 故不强制 service_healthy，避免 sidecar 故障导致整个后端起不来
      pdf2html:
        condition: service_started
      # docling 为软依赖：未就绪时上传回退本地 pandoc/pdf-parse，不阻断后端启动
      docling:
        condition: service_started
    volumes:
      # 上传文件目录挂载到宿主机，便于持久化与查看
      - ./uploads:/app/uploads
    # 生产环境经 nginx 反代，不直接暴露
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    healthcheck:
      # 使用 node 内置 http 模块探活，避免依赖 curl/wget
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # LibreOffice/pdf 转换是内存大户，限制资源避免 OOM 影响其他服务
    mem_limit: 2g
    cpus: 2
    # 同时接入 default（供 frontend 反代访问）与 internal（访问 postgres）
    networks:
      - default
      - internal

  # OnlyOffice Document Server（docx/odt 原格式编辑）
  # AGPL 许可，仅自用/内部部署合规；商业发行需购买商业版
  onlyoffice:
    # 固定版本标签，避免 :latest 不可重现升级带来 breaking change
    image: onlyoffice/documentserver:8.2
    container_name: lxdoc-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?必须在 .env 中设置 OnlyOffice JWT secret}
      # 关闭未授权存储访问：文件接口走鉴权签名 URL，不应允许 http 未授权存储
      USE_UNAUTHORIZED_STORAGE: "false"
    volumes:
      # 持久化文档转换缓存与字体
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-cache:/var/lib/onlyoffice
    # 生产环境经 nginx 反代，不直接暴露
    # ports:
    #   - "8081:80"
    expose:
      - "80"
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2

  # pdf2htmlEX sidecar：PDF → 版式保真 HTML（仅 compose 内网，不对外暴露）
  # 后端通过 PDF2HTML_URL 以 HTTP 调用，PDF 原文件字节 POST 到 /convert
  # sidecar 故障仅影响 PDF「版式预览」tab，「翻页预览」「编辑文本」「转可编辑」不受影响
  pdf2html:
    image: ${LXDOC_IMAGE_PREFIX:-ghcr.io/yangzhenyu-123}/lxdoc-pdf2html:${LXDOC_IMAGE_TAG:-latest}
    build:
      context: ./docker/pdf2html
      dockerfile: Dockerfile
    container_name: lxdoc-pdf2html
    expose:
      - "7000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7000/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1

  # docling-serve sidecar：统一文档解析（docx/odt/pdf → markdown + 图片/表格/OCR）
  # 作为主解析器：后端 DOCLING_ENABLED=true 时上传走此服务，失败自动回退 pandoc/pdf-parse
  # 仅 compose 内网，不对外暴露；CPU 镜像，OCR/大 PDF 解析吃内存，限制 4g/2cpu
  # 首次启动需下载约 2GB 模型，start_period 给 120s；模型缓存在 volume 避免重复下载
  docling:
    image: quay.io/docling-project/docling-serve:cpu-latest
    container_name: lxdoc-docling
    environment:
      # 内网部署可设 DOCLING_SERVE_API_KEY 增加鉴权，后端用 DOCLING_API_KEY 对应
      DOCLING_SERVE_ENABLE_UI: "false"
    volumes:
      - docling-models:/root/.cache/docling
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    networks:
      - internal

  # 前端 nginx 服务
  frontend:
    image: ${LXDOC_IMAGE_PREFIX:-ghcr.io/yangzhenyu-123}/lxdoc-frontend:${LXDOC_IMAGE_TAG:-latest}
    build:
      context: ./web
      dockerfile: ../docker/Dockerfile.frontend
      # 注入 docker 目录为命名上下文，供 Dockerfile COPY --from=docker nginx.conf 使用
      additional_contexts:
        docker: ./docker
    container_name: lxdoc-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      # nginx:alpine 自带 wget
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1

networks:
  # default 网络：对外服务（frontend）+ 需被 frontend 访问的后端
  default:
  # internal 网络：仅内部服务互通，不对外；postgres 仅接入此网，frontend 无法直连
  internal:
    internal: true

volumes:
  postgres-data:
  onlyoffice-data:
  onlyoffice-cache:
  docling-models:
