# LXDOC RAG 服务 overlay（TEI embedding + rerank）
# 用途：知识库 RAG 向量检索的模型服务，按需启用，不强制默认部署
#
# 启动方式（叠加在 docker-compose.yml 之上）：
#   docker-compose -f docker-compose.yml -f docker-compose.rag.yml up -d
#
# 或写入 .env 永久启用：
#   COMPOSE_FILE=docker-compose.yml:docker-compose.rag.yml
#   然后 docker-compose up -d 即同时拉起 RAG 服务
#
# 启用后 backend 自动通过内网服务名访问（http://tei-embed:80 / http://tei-rerank:80），
# 在 .env 中设置：
#   LLM_ENABLED=true
#   LLM_EMBED_MODEL=BAAI/bge-m3
#   LLM_EMBED_DIMENSIONS=1024
#   LLM_RERANK_MODEL=BAAI/bge-reranker-v2-m3   # 可选，启用 rerank 精排
#
# 首次启动会下载约 2GB 模型，start_period 给 180s；模型缓存在 volume 避免重复下载
# rerank 为可选：不设 LLM_RERANK_BASE_URL 时 RetrievalService 自动跳过 rerank 回退纯 RRF
#
# 离线环境（无 huggingface.co 外网）注意事项：
# - 模型需预先放入命名卷（docker run --rm -v <卷名>:/data -v <宿主机模型路径>:/src alpine cp -a /src/. /data/）
# - tei-rerank 若模型未就绪会启动失败，但因 backend 不硬依赖它，不影响主服务
# - 不需要 rerank 时，在 .env 设 LLM_RERANK_BASE_URL= 留空，backend 自动跳过
#
# 模型下载：huggingface.co 国内常被防火墙阻断，通过 HF_ENDPOINT=https://hf-mirror.com 走国内镜像
# 模型缓存到命名卷后，再次启动无需联网；内网生产机需预先在有网环境下载好模型再传入卷
#
# 生产机（内网无外网）部署步骤：
#   1. 在有外网的开发机执行：HF_ENDPOINT=https://hf-mirror.com docker-compose -f docker-compose.yml -f docker-compose.rag.yml up tei-embed tei-rerank
#   2. 待模型下载完成（容器日志出现 "Ready" 不再重启），停掉容器
#   3. 打包卷数据：tar -cf tei-models.tar -C /var/lib/docker/volumes/ lxdoc_tei-embed-models lxdoc_tei-rerank-models
#   4. 传到生产机 + 解包到对应目录 + docker-compose up -d tei-embed tei-rerank

services:
  # TEI embedding 服务（BAAI/bge-m3，1024 维，CPU 版）
  # 知识库创建/检索的向量生成依赖此服务
  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: lxdoc-tei-embed
    # bge-m3 模型加载峰值 RSS 约 33GB（192 个 tokenization worker 各持副本）；限制 workers+内存防 OOM
    command: --model-id ${LLM_EMBED_MODEL:-BAAI/bge-m3} --max-batch-tokens 8192 --max-concurrent-requests 64 --tokenization-workers 16
    environment:
      # 走国内 HF 镜像下载模型（huggingface.co 国内常被防火墙阻断）；模型已缓存后此变量无效
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      # 模型已缓存时设 HF_HUB_OFFLINE=1 可彻底跳过联网检查；首次下载须留空
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
    volumes:
      - tei-embed-models:/data
    expose:
      - "80"
    # TEI cpu-1.5 镜像无 curl/wget/python3，dash 不支持 /dev/tcp，无法做 HTTP 健康检查
    # 不设 healthcheck，靠 backend 的 embedding 重试机制兜底（模型已缓存时加载约 8s）
    restart: unless-stopped
    # bge-m3 模型加载峰值 RSS 约 17GB（ONNX 568M 参数），限制 32g 防 OOM；生产机 1TB 内存充足
    mem_limit: 32g
    cpus: 8
    networks:
      - default

  # TEI rerank 服务（BAAI/bge-reranker-v2-m3，cross-encoder 二次精排，CPU 版）
  # 可选：提升检索相关性；未配置 LLM_RERANK_BASE_URL 时 backend 自动跳过
  # 离线环境需预先将 rerank 模型放入 tei-rerank-models 卷，否则容器会因拉模型失败而退出
  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: lxdoc-tei-rerank
    command: --model-id ${LLM_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
    environment:
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
    volumes:
      - tei-rerank-models:/data
    expose:
      - "80"
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    networks:
      - default

  # 覆盖 backend：启用 RAG 后指向 compose 内 TEI 服务
  backend:
    environment:
      # embedding 端点默认指向 compose 内 tei-embed（覆盖 docker-compose.yml 的空默认值）
      LLM_EMBED_BASE_URL: ${LLM_EMBED_BASE_URL:-http://tei-embed:80}
      # rerank 端点：默认留空（禁用 rerank）；用户在 .env 设 http://tei-rerank:80 启用
      # 留空时 backend 跳过 rerank 回退纯 RRF；需确保 tei-rerank 容器有模型再启用
      LLM_RERANK_BASE_URL: ${LLM_RERANK_BASE_URL:-}
    depends_on:
      # embedding 软依赖：service_started 不等 healthcheck（TEI 无健康检查工具）
      # 模型已缓存时 TEI 加载约 8s，backend 启动期间 NestJS 初始化，首次 embedding 请求时 TEI 大概率 ready
      # 未 ready 时 backend 的 embed 重试机制（maxRetries=2）兜底
      tei-embed:
        condition: service_started

volumes:
  tei-embed-models:
  tei-rerank-models:
