# LXDOC 前端 nginx 配置

# WebSocket 连接映射：Upgrade 头为 websocket 时用 upgrade，否则用 close，
# 避免 OnlyOffice 普通 HTTP 请求被强制升级为 WebSocket
map $http_upgrade $oo_connection {
    default close;
    websocket upgrade;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- 全局安全响应头 ----
    # X-Content-Type-Options: 阻止 MIME 嗅探
    # X-Frame-Options: 仅允许同源 iframe（OnlyOffice 编辑器自身 iframe 同源）
    # Referrer-Policy: 仅向同源发送完整 Referer
    # X-XSS-Protection: 启用浏览器 XSS 过滤（旧浏览器）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 默认请求体上限（与后端 multer 上传限制对齐）
    client_max_body_size 100m;

    # 前端单页应用：未匹配静态资源时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理到 backend 容器
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 连接与读写超时，覆盖 nginx 默认 60s，避免大文档转换被提前断开
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 注意：不暴露 /uploads/ 直通。
    # 所有原始文件 / 图片访问统一走鉴权接口 /api/files/...（基于 JWT 签名 token），
    # 直接映射磁盘目录会导致越权下载。

    # OnlyOffice Document Server 反向代理
    # 同源访问：浏览器经 /onlyoffice 加载 api.js 与 iframe 通信，避免 CORS
    # 注意：OnlyOffice 对 Host 头敏感，需透传原始 Host
    location /onlyoffice/ {
        proxy_pass http://onlyoffice/;
        # 用 $http_host 保留外部端口（$host 不含端口，会导致 proxy_redirect
        # 构建的 Location 缺少 :8080 → 浏览器访问 80 端口失败）
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-Forwarded-Prefix: 告知 OnlyOffice 实际外部路径前缀为 /onlyoffice，
        # 其内部 nginx 的 $the_prefix 变量据此构建正确的重定向/资源 URL（已含 /onlyoffice 前缀），
        # iframe 内 socket.io 客户端也能正确构建带前缀的连接路径。
        # 注意：设置了 X-Forwarded-Prefix 后 OnlyOffice 重定向 Location 已含 /onlyoffice 前缀，
        # 只需修正 host:port（保留外部端口），无需再加前缀。
        proxy_set_header X-Forwarded-Prefix /onlyoffice;
        # OnlyOffice 9.4 内部 nginx 会将 /web-apps/apps/editor/index.html
        # 302 重定向到 http://<host>/<prefix>/9.4.0-xxx/...，
        # 其中 <prefix> 已含 /onlyoffice（来自 X-Forwarded-Prefix），
        # 但 <host> 可能是 localhost 或缺少端口，需重写为外部 $http_host（含端口）。
        proxy_redirect ~*^https?://[^/]+(/onlyoffice/.+)$ "$scheme://$http_host$1";
        # OnlyOffice 协同编辑需要 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oo_connection;
        # 大文件上传/转换需要较长超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 100m;
    }

    # kkFileView 统一预览反向代理
    # 同源访问：浏览器经 /kkview 加载预览 iframe，避免 CORS
    # kkFileView 内部用 LibreOffice 转换，需较长超时
    # 注意：kkfileview 容器需先启动，否则 nginx 启动时解析主机名失败；
    # 启动顺序由 docker-compose depends_on 保证（frontend depends_on kkfileview healthy）
    location /kkview/ {
        # proxy_pass 不带尾斜杠：透传完整 URI 给 kkfileview，
        # kkfileview 5.1.0 context-path 设为 /kkview，预览接口 /kkview/onlinePreview 能正确匹配。
        # 其内部重定向和静态资源 URL 均含 /kkview 前缀，无需 proxy_redirect。
        proxy_pass http://kkfileview:8012;
        # 用 $http_host 保留端口
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # kkFileView 拉取原文件转换可能耗时较长
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }
}
